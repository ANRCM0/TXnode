name: Node CI and images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      native_acceptance:
        description: Run the complete native soak and same-runner performance evidence
        required: false
        default: false
        type: boolean
      persistence_diagnostics:
        description: Run independent unprofiled persistence diagnostics without S3 acceptance
        required: false
        default: false
        type: boolean
  schedule:
    # The interop matrix downloads pinned third-party clients; run it nightly
    # so an upstream release cannot silently break the data plane.
    - cron: "17 3 * * *"

permissions:
  contents: read

# Each main SHA keeps an immutable dev-sha build. Only superseded PR work is cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('node-ci-pr-{0}', github.event.pull_request.number) || format('node-ci-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  persistence-diagnostics:
    name: Independent persistence diagnostic collection
    if: github.event_name == 'workflow_dispatch' && inputs.persistence_diagnostics
    uses: ./.github/workflows/native-persistence-diagnostics.yml
    with:
      candidate: ${{ github.sha }}

  native-evidence:
    name: Native stability and performance evidence
    if: github.event_name == 'workflow_dispatch' && inputs.native_acceptance
    uses: ./.github/workflows/native-acceptance.yml
    with:
      candidate: ${{ github.sha }}

  changes:
    name: Classify Node runtime changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep documentation and test-only pushes verification-only
        id: classify
        working-directory: .
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          runtime=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            runtime=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]] \
              || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              runtime=true
            else
              changed_files="$(mktemp)"
              git diff --no-renames --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" > "$changed_files"
              while IFS= read -r -d '' file; do
                case "$file" in
                  docs/*|*.md|.github/release/*|*_test.go|.gitignore) ;;
                  *) runtime=true ;;
                esac
              done < "$changed_files"
              rm -f "$changed_files"
            fi
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "Node runtime publishing selected: $runtime" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Node Go tests and source guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Node release tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          TXBOARD_IMAGE_REPO: ghcr.io/anrcm0/txnode
        run: bash scripts/resolve-image-tags.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - name: Fetch Go modules with bounded transport retries
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [[ "$attempt" != 3 ]]; then
              sleep 5
            fi
          done
          exit 1
      - name: Verify canonical Go module and source paths
        run: |
          set -euo pipefail
          grep -Fxq 'module github.com/ANRCM0/TX-Node' go.mod
          if grep -RFn 'github.com/PaiMonCai/TX-Node' cmd internal Makefile Dockerfile go.mod; then
            echo "Legacy TX-Node module path has reappeared" >&2
            exit 1
          fi
          if grep -Fq 'ghcr.io/paimoncai/tx-node' Dockerfile; then
            echo "Legacy TX-Node registry location has reappeared" >&2
            exit 1
          fi
          go mod verify
      - name: Enforce the native data plane and the absence of legacy kernels
        run: |
          set -euo pipefail
          if grep -REn 'sagernet/sing-box|sagernet/sing-vmess|xtls/xray-core|internal/deps/(sing-box|sing-vmess)' cmd internal go.mod go.sum; then
            echo "Legacy kernel dependency has reappeared" >&2
            exit 1
          fi
          test -d internal/kernel/txnode
          test -d internal/dataplane/core
          grep -Fq "kernel.type must be 'txnode'" internal/config/config.go
          go mod tidy -diff
      - name: Validate retained Node version and any release notes
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .github/release/VERSION)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "${GITHUB_REF_NAME%%-*}" == "$version" ]] || {
              echo 'Node release tag differs from the independent Node version metadata' >&2
              exit 1
            }
          fi
          if [[ -e .github/release/NOTES.md ]]; then
            grep -Fxq "# TX-Node $version" .github/release/NOTES.md
            retired_node_bin="xboard-node""-linux-"
            retired_cli_bin="xbctl""-linux-"
            retired_audit_zip="AccessAudit""-plugin.zip"
            if grep -Fq "$retired_node_bin" .github/release/NOTES.md \
              || grep -Fq "$retired_cli_bin" .github/release/NOTES.md \
              || grep -Fq "$retired_audit_zip" .github/release/NOTES.md; then
              echo "Historical release notes list retired artifacts" >&2
              exit 1
            fi
          else
            echo 'SKIP - historical release prose removed; version metadata validated.'
          fi
      - name: Verify release commit is contained in Node repository main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          (git fetch --no-tags --unshallow origin main || git fetch --no-tags origin main)
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must refer to a commit on Node repository main" >&2
            exit 1
          }
      - name: Run full Node tests
        run: make test
      - name: Repeat durable loaded SIGKILL intent handshakes
        run: go test -race -v ./internal/kernel/txnode -run '^TestNativeLoadedSIGKILLRestartsWithOriginalUsagePeriod$' -count=10 -timeout=5m
      - name: Verify pinned mux write completion patches
        run: |
          set -euo pipefail
          for dependency in smux yamux; do
            go -C "internal/deps/$dependency" test -race -count=1 ./...
            go -C "internal/deps/$dependency" vet ./...
          done
      - name: Verify strict interop result policy
        run: python3 -m unittest discover -s scripts -p 'test_interop_*.py' -v
      - name: Reject invalid process CPU measurement evidence
        run: python3 -m unittest discover -s scripts -p 'test_native_cpu.py' -v
      - name: Reject failed or missing native fault evidence
        run: python3 -m unittest discover -s scripts -p 'test_native_fault_summary.py' -v
      - name: Verify pinned Core Machine contract inspection
        run: python3 -m unittest discover -s scripts/tests/node-native-machine -p 'test_preflight.py' -v
      - name: Check independent Node image channels
        run: bash scripts/test-image-tags.sh
      - name: Verify native credential publication and replay history
        run: go test -race -count=1 -run 'Test(LiveHandler|KernelHotUserCredentials|KernelRevokesLiveSessionsAndRetainsTraffic|NativeMeterAuthorizationGenerations|PacketSession|ObsoletePacketHandshake|.*Replay)' ./internal/dataplane/core/... ./internal/dataplane/proto/... ./internal/kernel/txnode/...
      - name: Check Go types and diagnostics
        run: go vet ./...
      - name: Enforce legacy retirement boundary
        run: |
          set -euo pipefail
          test ! -d cmd/xbctl
          legacy_xboard_artifact="xboard-node""-linux-"
          legacy_xbctl_artifact="xbctl""-linux-"
          legacy_docker_alias="xboard-node"":latest"
          if grep -Fq "$legacy_xboard_artifact" Makefile .github/workflows/ci-node.yml \
            || grep -Fq "$legacy_xbctl_artifact" Makefile .github/workflows/ci-node.yml; then
            echo "Retired binary artifacts were reintroduced" >&2
            exit 1
          fi
          if grep -Eq "(^|[^[:alnum:]_.-])${legacy_docker_alias}([^[:alnum:]_.-]|$)" Makefile Dockerfile; then
            echo "Retired Docker alias was reintroduced" >&2
            exit 1
          fi
          grep -Fq 'CMD ["-c", "/etc/txnode/config.yml"]' Dockerfile

  runtime-stability:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    name: Node runtime stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - run: make test-runtime-stability

  image-smoke:
    name: Node image metadata and canonical configuration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image with Node repository metadata
        env:
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-sha-{0}', github.sha) }}
        run: |
          set -euo pipefail
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build --build-arg VERSION="$BUILD_VERSION" \
            --build-arg COMMIT="$GITHUB_SHA" --build-arg BUILD_TIME="$build_time" \
            --build-arg SOURCE_URL="https://github.com/$GITHUB_REPOSITORY" \
            -t txnode:config-path-ci .
          test "$(docker run --rm txnode:config-path-ci -v)" = "tx-node $BUILD_VERSION (built $build_time)"
          test "$(docker image inspect txnode:config-path-ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect txnode:config-path-ci --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "https://github.com/$GITHUB_REPOSITORY"
      - name: Verify canonical image command
        run: |
          set -euo pipefail
          test "$(docker image inspect txnode:config-path-ci --format '{{json .Config.Cmd}}')" = '["-c","/etc/txnode/config.yml"]'
      - name: Verify offline Installer capability in the exact built image
        run: |
          docker run --rm --network none txnode:config-path-ci --capabilities > "$RUNNER_TEMP/node-capabilities.json"
          python3 - "$GITHUB_SHA" "$RUNNER_TEMP/node-capabilities.json" <<'PY'
          import json,sys
          with open(sys.argv[2]) as source:
              proof=json.load(source)
          assert proof['protocol_version']==1 and proof['runtime']=='tx-node'
          assert proof['commit']==sys.argv[1]
          assert 'node_authorization_snapshot_v1' in proof['capabilities']
          assert 'node_runtime_checkpoint_v1' in proof['capabilities']
          print('Exact-image offline authorization capability passed')
          PY

  build:
    name: Node release binaries
    runs-on: ubuntu-latest
    needs: [test, runtime-stability, image-smoke, core-compatibility, core-machine, interop-quick, interop]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - name: Build release binary
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [[ "$GOARCH" == amd64 ]]; then
            make build-linux
          else
            make build-linux-arm64
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tx-node-linux-${{ matrix.goarch }}
          path: tx-node-linux-${{ matrix.goarch }}
          if-no-files-found: error

  publish-image:
    name: Publish independent Node image
    runs-on: ubuntu-latest
    needs: [changes, test, runtime-stability, image-smoke, core-compatibility, core-machine, interop-quick, interop]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.test.result == 'success' &&
          needs.image-smoke.result == 'success' && needs.core-compatibility.result == 'success' &&
          needs.interop-quick.result == 'success' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            needs.changes.outputs.runtime == 'true' && needs.runtime-stability.result == 'skipped' &&
            needs.interop.result == 'skipped') ||
           (startsWith(github.ref, 'refs/tags/v') && needs.runtime-stability.result == 'success' &&
            needs.interop.result == 'success' && needs.core-machine.result == 'success')) }}
    permissions:
      contents: read
      packages: write
    # Serialize the build and alias promotion together across main SHAs.
    # Documentation pushes do not enter this job or cancel its running build.
    concurrency:
      group: node-image-${{ github.ref_type == 'tag' && (contains(github.ref_name, '-') && 'preview' || 'stable') || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Resolve independent Node image channel
        id: channel
        working-directory: .
        env:
          TXBOARD_IMAGE_REPO: ghcr.io/anrcm0/txnode
        run: bash scripts/resolve-image-tags.sh
      - name: Select immutable build tags and metadata
        id: build
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          CHANNEL_TAGS: ${{ steps.channel.outputs.tags }}
        run: |
          set -euo pipefail
          tags="$CHANNEL_TAGS"
          version="$GITHUB_REF_NAME"
          if [[ "$CHANNEL" == dev ]]; then
            tags="$(grep -F ':dev-sha-' <<<"$CHANNEL_TAGS")"
            version="dev-sha-${GITHUB_SHA:0:12}"
          fi
          {
            printf 'tags<<NODE_BUILD_TAGS\n%s\nNODE_BUILD_TAGS\n' "$tags"
            printf 'version=%s\n' "$version"
            printf 'build_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Node image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=txnode
          cache-to: type=gha,mode=max,scope=txnode
          tags: ${{ steps.build.outputs.tags }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.build_time }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.build.outputs.version }}
      - name: Verify both published architectures by immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_VERSION: ${{ steps.build.outputs.version }}
        run: |
          python3 scripts/verify-published-image.py \
            --image "ghcr.io/anrcm0/txnode@$IMAGE_DIGEST" --commit "$GITHUB_SHA" \
            --source "https://github.com/$GITHUB_REPOSITORY" --version "$IMAGE_VERSION" \
            --output artifacts/published-image
      - name: Promote current main image to dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "main no longer contains this commit; skip dev promotion"
            exit 0
          }
          # A docs/tests-only commit may advance main while this build runs.
          # It must not cancel publication of the unchanged Node runtime.
          runtime_advanced=false
          changed_files="$(mktemp)"
          git diff --no-renames --name-only -z "$GITHUB_SHA" origin/main > "$changed_files"
          while IFS= read -r -d '' file; do
            case "$file" in
              docs/*|*.md|.github/release/*|*_test.go|.gitignore) ;;
              *) runtime_advanced=true ;;
            esac
          done < "$changed_files"
          rm -f "$changed_files"
          if [[ "$runtime_advanced" == true ]]; then
            echo "Node runtime advanced; retain immutable image without rolling dev back"
            exit 0
          fi
          docker buildx imagetools create --tag ghcr.io/anrcm0/txnode:dev \
            "ghcr.io/anrcm0/txnode@$IMAGE_DIGEST"
          actual_digest="$(docker buildx imagetools inspect ghcr.io/anrcm0/txnode:dev --format '{{json .Manifest}}' | jq -er '.digest')"
          test "$actual_digest" = "$IMAGE_DIGEST"
          printf '%s\n' "$actual_digest" > artifacts/published-image/promoted-dev-digest.txt
      - name: Retain published digest and offline runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-published-image-${{ github.sha }}
          path: artifacts/published-image/
          if-no-files-found: warn

  release-assets:
    name: Attach Node binaries to Node release
    runs-on: ubuntu-latest
    needs: [build, publish-image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release channel
        id: channel
        working-directory: .
        env:
          TXBOARD_IMAGE_REPO: ghcr.io/anrcm0/txnode
        run: bash scripts/resolve-image-tags.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: tx-node-linux-*
          merge-multiple: true
          path: dist
      # Node tags and release assets belong only to this repository.
      - name: Create Node release if missing and upload Node binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=(--latest)
            if [[ "$CHANNEL" == preview ]]; then
              flags=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "TX-Node $RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/tx-node-linux-amd64 dist/tx-node-linux-arm64 --clobber

  core-machine:
    name: Pinned Core machine contract with native Node
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: '1'
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: txboard_native_machine_test
      DB_USERNAME: txboard_native_machine
      DB_PASSWORD: native-machine-ci-only
      REDIS_PORT: '6379'
      REDIS_DB: '14'
      REDIS_CACHE_DB: '15'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: native-machine-root-ci-only
          MYSQL_DATABASE: txboard_native_machine_test
          MYSQL_USER: txboard_native_machine
          MYSQL_PASSWORD: native-machine-ci-only
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pnative-machine-root-ci-only" --health-interval 5s --health-timeout 5s --health-retries 24
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Read immutable supported Core
        id: core
        run: |
          python3 - <<'PY'
          import json, os, re
          value = json.load(open('compatibility/core.v1.json'))
          assert value['repository'] == 'ANRCM0/TXBoard'
          assert re.fullmatch('[0-9a-f]{40}', value['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + value['revision'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ANRCM0/TXBoard
          ref: ${{ steps.core.outputs.revision }}
          path: .compat/core
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, curl, openssl, sodium, bcmath, redis, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Prepare exclusive fixed Core fixture
        run: |
          set -euo pipefail
          if ! command -v mysql && ! command -v mariadb; then
            sudo apt-get update
            sudo apt-get install -y default-mysql-client
          fi
          python3 -m py_compile scripts/tests/node-native-machine/*.py
          php -l scripts/tests/node-native-machine/fixture.php
          cd .compat/core/api
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
      - name: Exercise production Orchestrator and existing Core machine contract
        run: python3 scripts/tests/node-native-machine/run.py .compat/core/api . "$RUNNER_TEMP/native-machine-evidence"
      - name: Retain source and assertion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-machine-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-machine-evidence/sources.json
            ${{ runner.temp }}/native-machine-evidence/compatibility-preflight.json
            ${{ runner.temp }}/native-machine-evidence/result.json
          if-no-files-found: warn

  core-compatibility:
    name: Native compatibility with pinned Core
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Read supported Core baseline
        id: core
        run: |
          python3 - <<'PY'
          import json, os, re
          value = json.load(open('compatibility/core.v1.json'))
          assert value['repository'] == 'ANRCM0/TXBoard'
          assert re.fullmatch('[0-9a-f]{40}', value['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as target:
              target.write('revision=' + value['revision'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ANRCM0/TXBoard
          ref: ${{ steps.core.outputs.revision }}
          path: .compat/core
          persist-credentials: false
      - name: Select candidate Node without changing Core source
        run: python3 scripts/prepare-core-compatibility.py
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, curl, openssl, sodium, bcmath, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Prepare pinned Core
        working-directory: .compat/core/api
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          APP_ENV=testing php artisan key:generate
      - name: Check Core and candidate renderer compatibility
        run: python3 scripts/check-renderer-compatibility.py
      - name: Actual Core activation, authorization, Provider, Node and settlement
        env:
          KERNEL_TYPE: txnode
        run: python3 .compat/core/scripts/verify-native-c2.py
      - name: Retain non-secret compatibility sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-core-compatibility-${{ github.sha }}
          path: artifacts/core-compatibility-sources.json
          if-no-files-found: error

  interop-quick:
    name: Strict interop quick matrix
    # Pin the system curl baseline as well as the four downloaded clients.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/interop-clients
          key: interop-clients-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-interop-clients.sh') }}
      - name: Fetch pinned clients
        run: scripts/fetch-interop-clients.sh "$RUNNER_TEMP/interop-clients"
      - name: Run and summarize strict quick interop
        if: ${{ !cancelled() }}
        env:
          TXNODE_INTEROP_XRAY: ${{ runner.temp }}/interop-clients/xray/xray
          TXNODE_INTEROP_SINGBOX: ${{ runner.temp }}/interop-clients/singbox/sing-box
        run: python3 scripts/interop_gate.py --profile quick --output artifacts/interop-quick
      - name: Retain quick interop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-interop-quick-${{ github.sha }}
          path: artifacts/interop-quick/
          if-no-files-found: warn

  interop:
    name: Strict third-party interop full matrix
    runs-on: ubuntu-24.04
    # Client binaries are test tools only. A tagged publisher depends on this
    # complete profile; dispatch and nightly runs verify without publishing.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/interop-clients
          key: interop-clients-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-interop-clients.sh') }}
      - name: Fetch pinned clients
        run: scripts/fetch-interop-clients.sh "$RUNNER_TEMP/interop-clients"
      - name: Run and summarize strict full interop
        if: ${{ !cancelled() }}
        env:
          TXNODE_INTEROP_XRAY: ${{ runner.temp }}/interop-clients/xray/xray
          TXNODE_INTEROP_MIHOMO: ${{ runner.temp }}/interop-clients/mihomo/mihomo
          TXNODE_INTEROP_SINGBOX: ${{ runner.temp }}/interop-clients/singbox/sing-box
          TXNODE_INTEROP_MIERU: ${{ runner.temp }}/interop-clients/mieru/mieru
          TXNODE_INTEROP_CURL: /usr/bin/curl
        run: python3 scripts/interop_gate.py --profile full --output artifacts/interop-full
      - name: Retain full interop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-interop-full-${{ github.sha }}
          path: artifacts/interop-full/
          if-no-files-found: warn
