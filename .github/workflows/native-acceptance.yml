name: Native stability and performance evidence

on:
  workflow_call:
    inputs:
      candidate:
        description: Immutable candidate commit
        required: true
        type: string
      baseline_profile:
        description: Separately named immutable legacy baseline
        required: false
        default: original-a1ad269-v1
        type: string
      latency_profile:
        description: Optional prospectively declared latency percentile budget
        required: false
        default: observations-only
        type: string
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate commit or ref (empty uses workflow SHA)
        required: false
        type: string
      baseline_profile:
        description: Original baseline or explicitly selected clock errata
        required: false
        default: original-a1ad269-v1
        type: choice
        options:
          - original-a1ad269-v1
          - legacy-clock-serialized-v1
      latency_profile:
        description: Observation history or an explicit fresh latency budget
        required: false
        default: observations-only
        type: choice
        options:
          - observations-only
          - percentiles-5pct-v1
      diagnostics_only:
        description: Run separate CPU and persistence diagnostics without S3 acceptance
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '43 20 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  source:
    name: Resolve immutable candidate
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      baseline_profile: ${{ steps.source.outputs.baseline_profile }}
      baseline_label: ${{ steps.source.outputs.baseline_label }}
      baseline_sha: ${{ steps.source.outputs.baseline_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          fetch-depth: 0
      - id: source
        name: Record candidate commit and tree
        env:
          BASELINE_PROFILE: ${{ inputs.baseline_profile || 'original-a1ad269-v1' }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p artifacts/source
          git rev-parse HEAD | tee artifacts/source/commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/source/tree.txt
          git status --porcelain --untracked-files=no > artifacts/source/status.txt
          test ! -s artifacts/source/status.txt
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/native_baselines.py --profile "$BASELINE_PROFILE" --output artifacts/source/baseline.json
          echo "baseline_profile=$BASELINE_PROFILE" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import native_baselines
          baseline = json.loads(Path('artifacts/source/baseline.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('baseline_label=' + native_baselines.artifact_label(baseline['profile']) + '\n')
              output.write('baseline_sha=' + baseline['commit'] + '\n')
          PY
      - name: Declare prospective latency budget before any measurement job
        if: inputs.latency_profile && inputs.latency_profile != 'observations-only'
        env:
          LATENCY_PROFILE: ${{ inputs.latency_profile }}
          BASELINE_PROFILE: ${{ inputs.baseline_profile || 'original-a1ad269-v1' }}
          DIAGNOSTICS_ONLY: ${{ inputs.diagnostics_only && 'true' || 'false' }}
        run: |
          set -euo pipefail
          test "$DIAGNOSTICS_ONLY" = false
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/native_latency.py plan --profile "$LATENCY_PROFILE" \
            --candidate "$GITHUB_SHA" --baseline-profile "$BASELINE_PROFILE" \
            --workflow-run "$GITHUB_RUN_ID" --tool-revision "$GITHUB_SHA" \
            --output artifacts/source/latency-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-${{ steps.source.outputs.sha }}
          path: artifacts/source/
          if-no-files-found: error

  errata-baseline-tests:
    name: Exact clock errata baseline collector race tests
    if: needs.source.outputs.baseline_profile == 'legacy-clock-serialized-v1'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.baseline_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum
      - name: Retain original collector guards and recovery tests on the exact errata tree
        env:
          BASELINE_SHA: ${{ needs.source.outputs.baseline_sha }}
          CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          mkdir -p artifacts/baseline-tests
          git rev-parse HEAD > artifacts/baseline-tests/commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/baseline-tests/tree.txt
          printf '%s\n' "$CANDIDATE_SHA" > artifacts/baseline-tests/candidate.txt
          go version > artifacts/baseline-tests/go-version.txt
          go test -race -json -count=1 ./internal/usageinterval -run '^TestNative' -timeout=10m \
            2>artifacts/baseline-tests/stderr.log | tee artifacts/baseline-tests/events.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-baseline-tests-${{ needs.source.outputs.baseline_label }}${{ needs.source.outputs.sha }}
          path: artifacts/baseline-tests/
          if-no-files-found: error

  soak:
    name: Native 30 minute TCP UDP mux soak
    if: inputs.diagnostics_only != true
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/interop-clients
          key: interop-clients-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-interop-clients.sh') }}
      - name: Fetch fixed client binaries
        run: scripts/fetch-interop-clients.sh "$RUNNER_TEMP/interop-clients"
      - name: Record source toolchain and runner evidence
        env:
          CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p artifacts/native-soak
          git rev-parse HEAD > artifacts/native-soak/commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/native-soak/tree.txt
          go version > artifacts/native-soak/go-version.txt
          uname -a > artifacts/native-soak/runner.txt
          lscpu >> artifacts/native-soak/runner.txt
          free -b >> artifacts/native-soak/runner.txt
          sha256sum "$RUNNER_TEMP/interop-clients/singbox/sing-box" > artifacts/native-soak/client-sha256.txt
      - name: Execute complete load window
        env:
          TXNODE_NATIVE_SOAK: '1'
          TXNODE_NATIVE_ARTIFACTS: ${{ github.workspace }}/artifacts/native-soak
          TXNODE_INTEROP_SINGBOX: ${{ runner.temp }}/interop-clients/singbox/sing-box
        run: |
          set -euo pipefail
          ulimit -n 32768
          go test -json ./internal/kernel/txnode -run '^TestNativeSessionSoak$' -count=1 -timeout=40m 2>artifacts/native-soak/stderr.log | tee artifacts/native-soak/events.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/native-soak/soak-summary.json').read_text())
          if not report['accepted'] or report['elapsed_seconds'] < 1800 or len(report['phases']) != 4:
              raise SystemExit('native soak acceptance incomplete')
          PY
      - name: Retain exact source load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-soak-${{ needs.source.outputs.sha }}
          path: artifacts/native-soak/
          if-no-files-found: error

  faults:
    name: Native live load lifecycle durability and process faults
    if: inputs.diagnostics_only != true
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum
      - name: Record exact fault-suite source and runtime
        env:
          CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p artifacts/native-faults
          git rev-parse HEAD > artifacts/native-faults/commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/native-faults/tree.txt
          go version > artifacts/native-faults/go-version.txt
          uname -a > artifacts/native-faults/runner.txt
      - name: Exercise mutations on the nodes carrying real traffic
        id: fault_run
        run: |
          set -euo pipefail
          go test -race -json ./internal/kernel/txnode ./internal/service ./internal/usagebucket \
            -run '^TestNative(ActiveLoadLifecycleFaults|LoadRateCancellation|UpstreamDisconnectKeepsLoadedPeerFlows|AuthenticatedShortWriteKeepsActualTail|LoadedSIGKILLRestartsWithOriginalUsagePeriod|LoadedAuthorizationExpiryDuringBlockedReport|RelayLoadSlowDiskRetainsExclusiveOwnerAndOriginalEvidence)$' \
            -count=1 -timeout=10m 2>artifacts/native-faults/stderr.log | tee artifacts/native-faults/events.jsonl
      - name: Retain an explicit verdict after successful or failed tests
        if: always()
        env:
          FAULT_TEST_OUTCOME: ${{ steps.fault_run.outcome }}
        run: python3 scripts/native-fault-summary.py artifacts/native-faults --test-outcome "$FAULT_TEST_OUTCOME"
      - name: Retain real relay and durable recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-faults-${{ needs.source.outputs.sha }}
          path: artifacts/native-faults/
          if-no-files-found: error

  performance-diagnostics:
    name: Independent native legacy CPU profiles
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum
      - name: Profile identical download paths outside the acceptance matrix
        env:
          CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
          BASELINE_PROFILE: ${{ needs.source.outputs.baseline_profile }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 scripts/native-acceptance.py --candidate "$CANDIDATE_SHA" --baseline-profile "$BASELINE_PROFILE" --output artifacts/native-performance-diagnostics --diagnostics-only
      - name: Retain independent CPU profiles even on diagnostic failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-performance-diagnostics-${{ needs.source.outputs.baseline_label }}${{ needs.source.outputs.sha }}
          path: |
            artifacts/native-performance-diagnostics/report.json
            artifacts/native-performance-diagnostics/report.md
            artifacts/native-performance-diagnostics/prefetch-*.log
            artifacts/native-performance-diagnostics/diagnostic-*/
          if-no-files-found: error

  performance:
    name: Same runner legacy candidate A B
    if: inputs.diagnostics_only != true
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum
      - name: Download this run's pre-load latency plan
        if: inputs.latency_profile && inputs.latency_profile != 'observations-only'
        uses: actions/download-artifact@v4
        with:
          name: native-source-${{ needs.source.outputs.sha }}
          path: artifacts/latency-source
      - name: Validate the immutable latency budget before building or loading either side
        if: inputs.latency_profile && inputs.latency_profile != 'observations-only'
        env:
          CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
          BASELINE_PROFILE: ${{ needs.source.outputs.baseline_profile }}
          LATENCY_PROFILE: ${{ inputs.latency_profile }}
        run: |
          set -euo pipefail
          python3 scripts/native_latency.py validate-plan --profile "$LATENCY_PROFILE" \
            --candidate "$CANDIDATE_SHA" --baseline-profile "$BASELINE_PROFILE" \
            --workflow-run "$GITHUB_RUN_ID" --tool-revision "$GITHUB_SHA" \
            --plan artifacts/latency-source/latency-plan.json
          mkdir -p artifacts/native-performance
          cp artifacts/latency-source/latency-plan.json artifacts/native-performance/latency-plan.json
      - name: Build both revisions and alternate five measurement groups
        env:
          CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
          BASELINE_PROFILE: ${{ needs.source.outputs.baseline_profile }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 scripts/native-acceptance.py --candidate "$CANDIDATE_SHA" --baseline-profile "$BASELINE_PROFILE" --output artifacts/native-performance
      - name: Evaluate only the prospectively declared latency percentiles
        if: always() && inputs.latency_profile == 'percentiles-5pct-v1'
        env:
          CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
          BASELINE_PROFILE: ${{ needs.source.outputs.baseline_profile }}
        run: |
          python3 scripts/native_latency.py summarize --profile percentiles-5pct-v1 \
            --candidate "$CANDIDATE_SHA" --baseline-profile "$BASELINE_PROFILE" \
            --workflow-run "$GITHUB_RUN_ID" --tool-revision "$GITHUB_SHA" \
            --plan artifacts/native-performance/latency-plan.json \
            --report artifacts/native-performance/report.json \
            --output artifacts/native-performance/latency-acceptance.json \
            --step-summary "$GITHUB_STEP_SUMMARY"
      - name: Publish comparison to job summary
        if: always()
        run: |
          if [[ -f artifacts/native-performance/report.md ]]; then
            cat artifacts/native-performance/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain exact source comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-performance-${{ needs.source.outputs.baseline_label }}${{ needs.source.outputs.sha }}
          path: artifacts/native-performance/
          if-no-files-found: error
      - name: Retain the separately named prospective latency proof
        if: always() && inputs.latency_profile == 'percentiles-5pct-v1'
        uses: actions/upload-artifact@v4
        with:
          name: native-latency-${{ needs.source.outputs.baseline_label }}percentiles-5pct-v1-${{ needs.source.outputs.sha }}
          path: |
            artifacts/native-performance/latency-plan.json
            artifacts/native-performance/latency-acceptance.json
          if-no-files-found: error

  acceptance:
    name: Exact source S3 acceptance ledger
    if: always() && inputs.diagnostics_only != true
    needs: [source, soak, faults, performance, errata-baseline-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*-${{ needs.source.outputs.sha }}
          path: evidence
      - name: Require all measured scopes on the identical candidate
        env:
          CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
          SOAK_JOB: ${{ needs.soak.result }}
          FAULTS_JOB: ${{ needs.faults.result }}
          PERFORMANCE_JOB: ${{ needs.performance.result }}
          BASELINE_TEST_JOB: ${{ needs.errata-baseline-tests.result }}
          BASELINE_PROFILE: ${{ needs.source.outputs.baseline_profile }}
          LATENCY_PROFILE: ${{ inputs.latency_profile || 'observations-only' }}
        run: |
          python3 scripts/native-s3-summary.py \
            --candidate "$CANDIDATE_SHA" --baseline-profile "$BASELINE_PROFILE" --evidence evidence --output s3-acceptance.json \
            --latency-profile "$LATENCY_PROFILE" --workflow-run "$GITHUB_RUN_ID" --tool-revision "$GITHUB_SHA" \
            --soak-job "$SOAK_JOB" --faults-job "$FAULTS_JOB" --performance-job "$PERFORMANCE_JOB" \
            --baseline-test-job "$BASELINE_TEST_JOB" \
            --step-summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-s3-acceptance-${{ inputs.latency_profile == 'percentiles-5pct-v1' && 'percentiles-5pct-v1-' || '' }}${{ needs.source.outputs.baseline_label }}${{ needs.source.outputs.sha }}
          path: s3-acceptance.json
          if-no-files-found: error
