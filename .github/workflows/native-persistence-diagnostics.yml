name: Independent canonical record encoding diagnostics

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full immutable candidate commit
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  encoding:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: candidate/go.sum
      - name: Record environment before the fixed plan
        run: |
          mkdir -p "$RUNNER_TEMP/record-encoding"
          { uname -a; lscpu; go version; } > "$RUNNER_TEMP/record-encoding/environment.txt"
      - name: Verify canonical compatibility and collect five alternating benchmark groups
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
        run: |
          python3 tooling/scripts/record-encoding-diagnostic.py --candidate "$CANDIDATE_SHA" --source "$GITHUB_WORKSPACE/candidate" --output "$RUNNER_TEMP/record-encoding"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-record-encoding-${{ inputs.candidate }}-${{ github.sha }}
          path: ${{ runner.temp }}/record-encoding/
          if-no-files-found: error
