name: Frozen native upload software CPU windows

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reproduce:
    name: Collect bounded software CPU windows from frozen binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install perf and record the unchanged runner context
        run: |
          set -euo pipefail
          sudo -n true
          sudo -n apt-get update
          sudo -n apt-get install -y linux-tools-common linux-tools-generic
          mkdir -p "$RUNNER_TEMP/native-follow-up-environment"
          uname -a > "$RUNNER_TEMP/native-follow-up-environment/uname.txt"
          lscpu > "$RUNNER_TEMP/native-follow-up-environment/lscpu.txt"
          findmnt -T "$RUNNER_TEMP" > "$RUNNER_TEMP/native-follow-up-environment/filesystem.txt"
          sysctl kernel.perf_event_paranoid kernel.kptr_restrict > "$RUNNER_TEMP/native-follow-up-environment/perf-policy.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/native-follow-up-environment/tool-source.txt"
      - name: Verify recording controls then collect six independent upload CPU windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/native-upload-perf-diagnostic.py \
            --output "$RUNNER_TEMP/native-upload-perf" \
            --reference "$RUNNER_TEMP/native-upload-perf-reference"
      - name: Retain finite diagnostic evidence without claiming S3 acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-upload-perf-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-upload-perf/
            ${{ runner.temp }}/native-follow-up-environment/
          if-no-files-found: error
