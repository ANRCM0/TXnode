name: Independent taskstats CPU capability probe

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  taskstats-capability:
    name: Verify TGID user and system counters without Node workloads
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable diagnostic source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p artifacts/taskstats-environment
          uname -a > artifacts/taskstats-environment/uname.txt
          cc --version > artifacts/taskstats-environment/compiler.txt
          cp /usr/include/linux/taskstats.h artifacts/taskstats-environment/taskstats.h
          sha256sum scripts/native-taskstats-probe.py /usr/include/linux/taskstats.h > artifacts/taskstats-environment/source.sha256
      - name: Query taskstats and compare short joined-thread fixtures with rusage
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/native-taskstats-probe.py --output artifacts/taskstats-capability
      - name: Retain raw protocol and capability observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-taskstats-capability-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
