name: Independent Machine concurrent PHP diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  machine-transport:
    name: Instrumented Machine four PHP workers (no acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: '1'
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: txboard_native_machine_test
      DB_USERNAME: txboard_native_machine
      DB_PASSWORD: native-machine-ci-only
      REDIS_PORT: '6379'
      REDIS_DB: '14'
      REDIS_CACHE_DB: '15'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: native-machine-root-ci-only
          MYSQL_DATABASE: txboard_native_machine_test
          MYSQL_USER: txboard_native_machine
          MYSQL_PASSWORD: native-machine-ci-only
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pnative-machine-root-ci-only" --health-interval 5s --health-timeout
          5s --health-retries 24
      redis:
        image: redis:7.4
        ports:
        - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval 5s --health-retries 12
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Record isolated diagnostic source
      run: 'python3 - <<''PY''

        import hashlib,json,os,subprocess

        from pathlib import Path

        base=''8735d7ac01a45360900d93fa0d38721caf0f33e8''

        def git(*args):return subprocess.check_output([''git'',*args])

        root=Path(os.environ[''RUNNER_TEMP''])/''machine-transport-source''

        root.mkdir(parents=True,exist_ok=True)

        paths=[''internal/usagev2/http.go'',''internal/usagev2/machine_transport_diagnostic.go'',''internal/service/native_usage_adapter.go'',''scripts/tests/node-native-machine/tls_proxy.py'',''scripts/tests/node-native-machine/run.py'']

        data={''schema'':''txnode-machine-transport-instrumentation/v1'',''base'':base,''diagnostic_source'':git(''rev-parse'',''HEAD'').decode().strip(),''diagnostic_tree'':git(''rev-parse'',''HEAD^{tree}'').decode().strip(),''current_sha256'':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest()for
        p in paths},''original_http_sha256'':hashlib.sha256(git(''show'',base+'':internal/usagev2/http.go'')).hexdigest(),''accepted_for_S3'':False,''scope'':''Diagnostic
        clone with startup context label, request stopwatch, backend timing aggregates, and original unchanged transport refusal.
        No request body, timeout, recovery policy, capacity, ACK or Core source change. Instrumented clone is not release
        acceptance.''}

        (root/''instrumentation.json'').write_text(json.dumps(data,indent=2)+chr(10))

        (root/''transport-overlay.patch'').write_bytes(git(''diff'',base,''HEAD'',''--'',*paths))

        PY'
    - name: Read immutable supported Core
      id: core
      run: "python3 - <<'PY'\nimport json, os, re\nvalue = json.load(open('compatibility/core.v1.json'))\nassert value['repository']\
        \ == 'ANRCM0/TXBoard'\nassert re.fullmatch('[0-9a-f]{40}', value['revision'])\nwith open(os.environ['GITHUB_OUTPUT'],\
        \ 'a') as output:\n    output.write('revision=' + value['revision'] + '\\n')\nPY\n"
    - uses: actions/checkout@v4
      with:
        repository: ANRCM0/TXBoard
        ref: ${{ steps.core.outputs.revision }}
        path: .compat/core
        persist-credentials: false
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo_mysql, pdo_sqlite, curl, openssl, sodium, bcmath, redis, fileinfo
        coverage: none
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Prepare exclusive fixed Core fixture
      run: "set -euo pipefail\nif ! command -v mysql && ! command -v mariadb; then\n  sudo apt-get update\n  sudo apt-get\
        \ install -y default-mysql-client\nfi\npython3 -m py_compile scripts/tests/node-native-machine/*.py\nphp -l scripts/tests/node-native-machine/fixture.php\n\
        cd .compat/core/api\ncomposer install --no-interaction --prefer-dist\ncp .env.example .env\nphp artisan key:generate\n"
    - name: Exercise production Orchestrator and existing Core machine contract
      run: python3 scripts/tests/node-native-machine/run.py .compat/core/api . "$RUNNER_TEMP/native-machine-evidence"
    - name: Retain source and assertion evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: machine-four-workers-${{ github.sha }}
        path: '${{ runner.temp }}/native-machine-evidence/sources.json

          ${{ runner.temp }}/native-machine-evidence/compatibility-preflight.json

          ${{ runner.temp }}/native-machine-evidence/result.json


          ${{ runner.temp }}/machine-transport-source/instrumentation.json

          ${{ runner.temp }}/machine-transport-source/transport-overlay.patch

          ${{ runner.temp }}/native-machine-evidence/fixture-http-profile.json'
        if-no-files-found: warn
