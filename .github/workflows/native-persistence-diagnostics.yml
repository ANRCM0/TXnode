name: Independent measurement-window events-long CPU profiles
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version: 1.26.0
        cache-dependency-path: go.sum
    - uses: actions/download-artifact@v4
      with:
        name: native-long-cpu-2dbf6834d4aa313b50b782e5326e718490e4d051
        run-id: 40059251852
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/long-cpu-reference
    - name: Record environment before the fixed diagnostic plan
      run: 'set -euo pipefail

        mkdir "$RUNNER_TEMP/extended-profile-environment"

        uname -a > "$RUNNER_TEMP/extended-profile-environment/environment.txt"

        lscpu >> "$RUNNER_TEMP/extended-profile-environment/environment.txt"

        findmnt -T "$RUNNER_TEMP" >> "$RUNNER_TEMP/extended-profile-environment/environment.txt"

        go version >> "$RUNNER_TEMP/extended-profile-environment/environment.txt"

        '
    - name: Build diagnostic-only harnesses and collect six windowed profile pairs
      run: python3 scripts/events-long-cpu-profile.py --windowed-harness --output
        "$RUNNER_TEMP/window-events-long-profile" --reference-directory "$RUNNER_TEMP/long-cpu-reference"
    - name: Retain every instrumented sample and failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: window-events-long-profile-${{ github.sha }}
        path: '${{ runner.temp }}/window-events-long-profile/

          ${{ runner.temp }}/extended-profile-environment/'
        if-no-files-found: error
