name: Independent single CPU long-workload investigation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'
jobs:
  long-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version: 1.26.0
        cache-dependency-path: go.sum
    - uses: actions/download-artifact@v4
      with:
        name: native-actions-single-cpu-90508592b4c0b433eb9a71f367694a981aa958e1-40041704618
        run-id: 40041704618
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/long-cpu-reference
    - name: Record unchanged-host environment and diagnostic tool
      run: "set -euo pipefail\nif ! command -v strace; then\n  sudo apt-get update -qq\n  sudo apt-get install -y strace\n\
        fi\nsudo -n true\nmkdir \"$RUNNER_TEMP/long-cpu-environment\"\nuname -a > \"$RUNNER_TEMP/long-cpu-environment/environment.txt\"\
        \nlscpu >> \"$RUNNER_TEMP/long-cpu-environment/environment.txt\"\nfindmnt -T \"$RUNNER_TEMP\" >> \"$RUNNER_TEMP/long-cpu-environment/environment.txt\"\
        \nstrace -V >> \"$RUNNER_TEMP/long-cpu-environment/environment.txt\"\n"
    - name: Reproduce only the two CPU cases then collect bounded syscall summaries
      run: python3 scripts/native-long-cpu-investigation.py --output "$RUNNER_TEMP/native-long-cpu" --reference-directory
        "$RUNNER_TEMP/long-cpu-reference"
    - name: Retain diagnostic observations without an acceptance claim
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-long-cpu-${{ github.sha }}
        path: '${{ runner.temp }}/native-long-cpu/

          ${{ runner.temp }}/long-cpu-environment/'
        if-no-files-found: error
