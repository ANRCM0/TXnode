name: Independent native completion clock diagnostics

on:
  workflow_call:
    inputs:
      candidate:
        description: Full immutable runtime candidate SHA; diagnostic tool uses dispatch ref
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate:
        description: Full immutable runtime candidate SHA; diagnostic tool uses dispatch ref
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  persistence-diagnostics:
    name: First rejected completion clock snapshots (no S3 acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum
      - name: Verify immutable source and diagnostic contracts
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain)"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          python3 -m unittest discover -s scripts -p 'test_native_clock_diagnostics.py' -v
      - name: Collect five bounded instrumented upload pairs
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          python3 scripts/native-clock-diagnostics.py --candidate "$CANDIDATE_SHA" --output artifacts/native-clock-diagnostics
      - name: Publish diagnostic observations without an acceptance verdict
        if: always()
        run: |
          if [[ -f artifacts/native-clock-diagnostics/report.md ]]; then
            cat artifacts/native-clock-diagnostics/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain independent evidence including accounting failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-clock-diagnostics-${{ github.sha }}
          path: |
            artifacts/native-clock-diagnostics/report.json
            artifacts/native-clock-diagnostics/report.md
            artifacts/native-clock-diagnostics/prefetch-*.log
            artifacts/native-clock-diagnostics/build-*/*.json
            artifacts/native-clock-diagnostics/build-*/*.patch
            artifacts/native-clock-diagnostics/clock-*/sample.json
            artifacts/native-clock-diagnostics/clock-*/server.log
            artifacts/native-clock-diagnostics/clock-*/clock-rejection.json
          if-no-files-found: error
