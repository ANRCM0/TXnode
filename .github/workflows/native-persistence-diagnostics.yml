name: Independent process user and system CPU split

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  rusage-cpu-split:
    name: Rebuild symmetric diagnostic harnesses and collect bounded CPU splits
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum
      - name: Record immutable tooling and unchanged runner context
        env:
          TOOL_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOOL_SOURCE"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/rusage-environment"
          uname -a > "$RUNNER_TEMP/rusage-environment/uname.txt"
          lscpu > "$RUNNER_TEMP/rusage-environment/lscpu.txt"
          findmnt -T "$RUNNER_TEMP" > "$RUNNER_TEMP/rusage-environment/filesystem.txt"
          go version > "$RUNNER_TEMP/rusage-environment/go-version.txt"
          sha256sum scripts/native-rusage-cpu-split.py scripts/native-cpu-latency-follow-up.py > "$RUNNER_TEMP/rusage-environment/tool-source.sha256"
      - name: Verify production binary identity then collect ten independent upload windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/native-rusage-cpu-split.py             --output "$RUNNER_TEMP/native-rusage-split"             --reference "$RUNNER_TEMP/native-rusage-reference"
      - name: Retain the original CPU windows, component bounds and build identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rusage-split-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-rusage-split/
            ${{ runner.temp }}/rusage-environment/
          if-no-files-found: error
